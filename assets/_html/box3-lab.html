<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  body{background:#EAF2FA;padding:0;display:block;width:1000px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:30px;padding:34px 48px;border-bottom:1px solid #d7e4f1}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 150px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.45}
  .tag small{display:block;font-weight:400;color:#7d95ad;margin-top:3px;font-size:12px}
  .big{width:100px;height:100px;flex:0 0 auto}
  .chip{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
  .chip svg{width:36px;height:36px}
  .cw{background:#fff;border:1px solid #dbe7f3}
  .cn{background:#0A1F3C}
  .lock{display:flex;align-items:center;gap:14px;flex:0 0 auto}
  .lock svg{width:54px;height:54px}
  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap;font-size:40px;position:relative}
  .ink{color:#0B3A66}.bl{color:#1B9DF0}
  .b{position:relative;display:inline-block}
  .wipe{position:absolute;left:0;bottom:-.15em;width:100%;height:.30em;overflow:visible}
  .bub{display:inline-block;width:.3em;height:.3em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .03em}
  .bub i{position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.92);left:18%;top:15%}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

    <path d="M50 52 L66 52 L76 40 L56 36 Z" fill="#fff"/>
