<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  body{background:#EAF2FA;padding:0;display:block;width:1000px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:30px;padding:34px 48px;border-bottom:1px solid #d7e4f1}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 150px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.45}
  .tag small{display:block;font-weight:400;color:#7d95ad;margin-top:3px;font-size:12px}
  .big{width:100px;height:100px;flex:0 0 auto}
  .chip{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
  .chip svg{width:36px;height:36px}
  .cw{background:#fff;border:1px solid #dbe7f3}
  .cn{background:#0A1F3C}
  .lock{display:flex;align-items:center;gap:14px;flex:0 0 auto}
  .lock svg{width:52px;height:52px}
  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap;font-size:38px;position:relative}
  .ink{color:#0B3A66}.bl{color:#1B9DF0}
  .b{position:relative;display:inline-block}
  .wipe{position:absolute;left:0;bottom:-.15em;width:100%;height:.30em;overflow:visible}
  .bub{display:inline-block;width:.3em;height:.3em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .03em}
  .bub i{position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.92);left:18%;top:15%}
  .lab{font-family:'Inter';font-size:10px;color:#94a8bb;text-align:center;margin-top:2px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

  <!-- LA1: iso outline open box, navy line, blue sparkle -->
  <symbol id="la1" viewBox="0 0 100 100">
    <g fill="none" stroke="#0B3A66" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 52 L50 64 L72 52"/>
      <path d="M50 64 L50 88"/>
      <path d="M28 52 L28 74 L50 88 L72 74 L72 52"/>
      <path d="M28 52 L18 38 L42 30 L50 40 L58 30 L82 38 L72 52"/>
      <path d="M50 40 L50 64"/>
    </g>
    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#1B9DF0"/>
  </symbol>

      <path d="M28 52 L28 74 L50 88 L72 74 L72 52"/>
      <path d="M28 52 L18 38 L42 30 L50 40 L58 30 L82 38 L72 52"/>
      <path d="M50 40 L50 64"/>
    </g>
    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#5AB7F5"/>
  </symbol>

    <g fill="none" stroke="#0B3A66" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 52 L28 74 L50 88 L72 74 L72 52"/>

    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#1B9DF0"/>
  </symbol>
  <symbol id="la2w" viewBox="0 0 100 100">
    <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 52 L28 74 L50 88 L72 74 L72 52"/>
      <path d="M50 64 L50 88"/>
      <path d="M28 52 L50 64 L72 52"/>
    </g>
    <g fill="none" stroke="#5AB7F5" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 52 L18 38 L42 30 L50 40"/>
      <path d="M72 52 L82 38 L58 30 L50 40"/>
      <path d="M50 40 L50 52"/>
    </g>
    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#5AB7F5"/>
  </symbol>

  <!-- LA3: simpler front-ish outline open box (no side face), rounded -->
  <symbol id="la3" viewBox="0 0 100 100">
    <g fill="none" stroke="#0B3A66" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="30" y="50" width="40" height="36" rx="4"/>
      <path d="M30 56 L22 40 L46 34 L50 44 L54 34 L78 40 L70 56"/>
    </g>
    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#1B9DF0"/>
  </symbol>
  <symbol id="la3w" viewBox="0 0 100 100">
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="30" y="50" width="40" height="36" rx="4"/>
      <path d="M30 56 L22 40 L46 34 L50 44 L54 34 L78 40 L70 56"/>
    </g>
    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#5AB7F5"/>
  </symbol>

</defs></svg>

<div class="row"><div class="tag">LA1 · Iso-ääriviiva<small>3/4, läpät auki</small></div>

</div>

</body></html>
