<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — oirelista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_niukka.css" rel="stylesheet">
</head>
<body>
  <!-- OIRELISTA-KULMA (Kilpilasilta, 22.9.2026). Heidän avauksensa:
       "Yksi ikkuna vetää. Toinen huurtuu. Kolmannen kahva on löysä…" ja
       sitten väärä johtopäätös "koko talon ikkunat pitää uusia".

       Miksi se toimii: katsoja tunnistaa oman kotinsa ENNEN kuin hänelle
       myydään mitään. Meidän ankkurimme sopii siihen suoraan — johtopäätös
       on väärä juuri siksi että tiivistys maksaa murto-osan.

       Kuva on makrolähikuva, koska se on mitattu voittajaksi tällä tilillä. -->
  <div class="photo"><img src="kuvat/ad-ikkuna-kulma.jpg" alt=""></div>
  <div class="wash"></div>
  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>
  <div class="block">
    <h1>Yksi ikkuna vetää.<br>Toinen huurtuu.<br><span class="hl">Koko talo ei ole rikki.</span></h1>
    <p class="sub">Ikkunan tiivistys alk. 75 €. Säätö ja öljyäminen kuuluvat hintaan.</p>
    <!-- Painikkeen tekstin on vastattava mainoksen CTA:ta (GET_QUOTE =
         liidilomake). "Laske hinta" lupaisi laskurin ja veisi lomakkeeseen. -->
    <span class="btn">Pyydä tarjous
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
</body></html>
