<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — ryhmäjulkaisu: kuluttaja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_niukka.css" rel="stylesheet">
<style>
  /* Ryhmäjulkaisu, ei mainos: Metan nappia ei ole, joten yhteystiedot on
     oltava kuvassa. Muuten sama niukka-kaava kuin mainoksissa. */
  h1 { font-size: 78px; }
  .yhteys { display: inline-flex; align-items: center; gap: 16px; margin-top: 32px;
    background: #fff; color: #1D6E46; font-weight: 800; font-size: 33px;
    letter-spacing: -.01em; padding: 24px 40px; border-radius: 18px;
    box-shadow: 0 20px 46px -16px rgba(0,0,0,.5); }
  .yhteys .erotin { color: rgba(29,110,70,.35); font-weight: 700; }
  .alue { position: absolute; top: 54px; right: 58px; z-index: 3;
    background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.55);
    color: #fff; font-weight: 800; font-size: 27px; letter-spacing: -.01em;
    padding: 14px 26px; border-radius: 999px;
    backdrop-filter: blur(6px); text-shadow: 0 2px 10px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <div class="photo"><img src="kuvat/ad-porukka.jpg" alt=""></div>
  <div class="wash"></div>

  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>
  <div class="alue">Koko Uusimaa</div>

  <div class="block">
    <!-- Sivuston sanamuoto tarkalleen: 10–15 % on se, paljonko vetävä ikkuna
         NOSTAA kulua — ei luvattu säästö. Älä käännä tätä toisin päin. -->
    <h1>Vetävä ikkuna nostaa<br>lämmityskulua<br><span class="hl">10–15 %.</span></h1>
    <p class="sub">Tiivisteiden vaihto kiinteään hintaan — ikkuna 75–90 €, ovi 99 €.<br>Kotitalousvähennys −40 %. Varaa aika netissä tai soita.</p>
    <span class="yhteys">tiiviskoti.fi <span class="erotin">·</span> 045 875 5996</span>
  </div>
</body></html>
