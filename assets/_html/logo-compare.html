<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{background:#fff;display:block;width:980px;font-family:'Gabarito'}
  .head{display:grid;grid-template-columns:1fr 1fr;background:#EAF2FA}
  .hcol{padding:40px;display:flex;flex-direction:column;align-items:center;gap:16px;border-right:1px solid #d7e4f1}
  .hcol:last-child{border-right:0}
  .hcol .ttl{font-family:'Inter';font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5b7a99}
  .hico{width:120px;height:120px}
  .lockwrap{padding:40px 50px;border-top:1px solid #d7e4f1;background:#EAF2FA}
  .lockwrap.dk{background:#0A1F3C}
  .lab{font-family:'Inter';font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8aa1b8;margin-bottom:24px}
  .dk .lab{color:#5f7d9c}
  .lock{display:flex;align-items:center;gap:20px;margin-bottom:26px}
  .lock:last-child{margin-bottom:0}
  .ico{flex:0 0 auto;width:58px;height:58px}
  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.035em;line-height:1;white-space:nowrap;display:inline-block;position:relative;font-size:46px}
  .d{color:#0B3A66}.bl{color:#1B9DF0}
  .dk .d{color:#fff}.dk .bl{color:#5AB7F5}
  .b{position:relative;display:inline-block}
  .wipe{position:absolute;left:-3%;bottom:-.30em;width:106%;height:.26em;overflow:visible}
  .bub{display:inline-block;width:.28em;height:.28em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .02em}
  .bub i{position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.92);left:18%;top:15%}
  .dk .bub{background:#5AB7F5}
  .favs{display:grid;grid-template-columns:1fr 1fr;background:#EAF2FA;border-top:1px solid #d7e4f1}
  .fcol{padding:30px 40px;display:flex;align-items:center;gap:14px;justify-content:center;border-right:1px solid #d7e4f1}
  .fcol:last-child{border-right:0}
  .chip{width:54px;height:54px;border-radius:13px;display:grid;place-items:center}
  .cw{background:#fff;border:1px solid #d4e3f1}.cn{background:#0A1F3C}
  .chip svg{width:40px;height:40px}
  .fname{font-family:'Inter';font-size:12px;font-weight:700;color:#5b7a99;margin-right:8px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

</defs></svg>

  <div class="lock"><svg class="ico"><use href="#dropw"/></svg><span class="lg"><span class="d">Loppu</span><span class="b bl">siivous<svg class="wipe"><use href="#sw" fill="#5AB7F5"/></svg></span><span class="bub"><i></i></span><span class="d">fi</span></span></div>

</body></html>
