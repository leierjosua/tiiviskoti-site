<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{background:#fff;display:block;width:1000px;font-family:'Gabarito'}
  .band{padding:56px 64px}
  .light{background:#EAF2FA}
  .dark{background:#0A1F3C}
  .cap{font-family:'Inter';font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8aa1b8;margin-bottom:30px}
  .dark .cap{color:#5f7d9c}
  .stack{display:flex;flex-direction:column;gap:48px}
  .unit{display:flex;align-items:center;gap:24px}

  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.035em;line-height:1;white-space:nowrap;display:inline-block;position:relative;font-size:58px}
  .d{color:#0B3A66}.bl{color:#1B9DF0}
  .dark .d{color:#fff}.dark .bl{color:#5AB7F5}
  .b{position:relative;display:inline-block}
  /* swoosh sits FULLY below the baseline */
  .wipe{position:absolute;left:-.02em;bottom:-.30em;width:1.04em;height:.26em;overflow:visible}
  .b .wipe{width:104%}
  .bub{display:inline-block;width:.28em;height:.28em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .02em}
  .bub i{position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.92);left:18%;top:15%}
  .dark .bub{background:#5AB7F5}

  .ico{flex:0 0 auto;width:66px;height:66px}
  .chiprow{display:flex;gap:18px;align-items:center;margin-top:8px}
  .chip{width:52px;height:52px;border-radius:13px;display:grid;place-items:center}
  .cw{background:#fff;border:1px solid #d4e3f1}
  .cn{background:#0A1F3C}
  .chip svg{width:38px;height:38px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <!-- clean tapered swoosh, stays low -->
  <symbol id="sw" viewBox="0 0 200 24" preserveAspectRatio="none">
    <path d="M10 11 C70 7 140 7 184 9 C190 9.3 193 10.5 193 12 C190 11.5 186 11.3 182 11.6 C140 13 70 14 12 17 C5 17.6 4 11.5 10 11 Z"/>
  </symbol>
  <!-- open box line-art -->
  <symbol id="box" viewBox="0 0 100 100">
    <g fill="none" stroke="#0B3A66" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 52 L50 64 L72 52"/>
      <path d="M50 64 L50 88"/>
      <path d="M28 52 L28 74 L50 88 L72 74 L72 52"/>
      <path d="M28 52 L18 38 L42 30 L50 40 L58 30 L82 38 L72 52"/>
      <path d="M50 40 L50 64"/>
    </g>
    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#1B9DF0"/>
  </symbol>
  <symbol id="boxw" viewBox="0 0 100 100">
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 52 L50 64 L72 52"/>
      <path d="M50 64 L50 88"/>
      <path d="M28 52 L28 74 L50 88 L72 74 L72 52"/>
      <path d="M28 52 L18 38 L42 30 L50 40 L58 30 L82 38 L72 52"/>
      <path d="M50 40 L50 64"/>
    </g>
    <path d="M50 8 C50 16 53 19 61 19 C53 19 50 22 50 30 C50 22 47 19 39 19 C47 19 50 16 50 8 Z" fill="#5AB7F5"/>
  </symbol>
</defs></svg>

<div class="band light">
  <div class="cap">Vaalea tausta</div>
  <div class="stack">
    <div class="unit">
      <span class="lg"><span class="d">Loppu</span><span class="b bl">siivous<svg class="wipe"><use href="#sw" fill="#1B9DF0"/></svg></span><span class="bub"><i></i></span><span class="d">fi</span></span>
    </div>
    <div class="unit">
      <svg class="ico"><use href="#box"/></svg>
      <span class="lg"><span class="d">Loppu</span><span class="b bl">siivous<svg class="wipe"><use href="#sw" fill="#1B9DF0"/></svg></span><span class="bub"><i></i></span><span class="d">fi</span></span>
    </div>
  </div>
</div>

<div class="band dark">
  <div class="cap">Tumma tausta</div>
  <div class="stack">
    <div class="unit">
      <span class="lg"><span class="d">Loppu</span><span class="b bl">siivous<svg class="wipe"><use href="#sw" fill="#5AB7F5"/></svg></span><span class="bub"><i></i></span><span class="d">fi</span></span>
    </div>
    <div class="unit">
      <svg class="ico"><use href="#boxw"/></svg>
      <span class="lg"><span class="d">Loppu</span><span class="b bl">siivous<svg class="wipe"><use href="#sw" fill="#5AB7F5"/></svg></span><span class="bub"><i></i></span><span class="d">fi</span></span>
    </div>
  </div>
</div>

<div class="band light">
  <div class="cap">Favicon / symboli</div>
  <div class="chiprow">
    <div class="chip cw"><svg><use href="#box"/></svg></div>
    <div class="chip cn"><svg><use href="#boxw"/></svg></div>
  </div>
</div>

</body></html>
