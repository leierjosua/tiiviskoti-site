<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — TK51 ankkuri talo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <!-- TK51 ANKKURI, TALON MITTAKAAVA. Perhe A variaatio 2/3. Sama vertailu
       kuin voittavassa TK37:ssa mutta koko talon summina: iso luku
       vastaan iso luku. Testaa pureeko kokonaissumma paremmin kuin
       yksikkohinta. 998 EUR = 10 ikkunaa + 2 ovea, 12 000 EUR = samojen
       10 ikkunan vaihto a 1 200 EUR. -->
  <div class="photo"><img src="kuvat/ad-ikkuna-kulma.jpg" alt=""></div>
  <div class="wash"></div>
  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>
  <div class="block">
    <h1><span class="hl">Koko talon ikkunat<br>tiivistettynä 998 €.</span><br><span class="anchor">Vaihdettuna 12 000 €.</span></h1>
    <p class="sub">Tiivisteet uusitaan, ikkunat jäävät — yksi käynti</p>
    <span class="btn">Laske oma hintasi
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
