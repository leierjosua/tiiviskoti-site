<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Manrope,system-ui,sans-serif;background:#F2F5F0;color:#13201A;
    padding:22px 16px 60px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:26px;letter-spacing:-.02em;margin-bottom:6px}
  .lead{font-size:15px;color:#5C6B62;margin-bottom:8px}
  .tip{font-size:14px;color:#5C6B62;background:#E7EFE6;border:1px solid #D8E3D6;
    border-radius:12px;padding:12px 14px;margin:16px 0 26px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.13em;color:#5C6B62;
    margin:30px 0 12px}
  .item{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid #DCE3D9;
    border-radius:14px;padding:10px;margin-bottom:10px;text-decoration:none;color:inherit}
  .item:active{background:#EFF4EE}
  .thumb{width:64px;height:80px;border-radius:9px;overflow:hidden;flex:none;background:#12301F}
  .thumb.v{height:80px}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
  .txt span{display:block;font-size:13px;color:#6B7A70;margin-top:2px}
  .dl{font-size:22px;color:#1D6E46;font-weight:800;padding:0 6px}
</style>
</head>
<body><div class="wrap">
  <h1>Mainosaineistot</h1>
  <p class="lead">11 videota ja 16 kuvaa. Valmiita someen sellaisenaan.</p>
  <p class="tip"><b>Puhelimessa:</b> paina riviä ja valitse <b>Lataa</b> tai <b>Tallenna</b>.
  Jos video aukeaa soittimeen, paina jakokuvaketta → Tallenna videoihin.
  Videot ovat 1080×1920 (Reels/Stories/Shorts), kuvat 1080×1350 tai 1080×1920.</p>
