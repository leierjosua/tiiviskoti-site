<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — korttimainos: mainos-kortti-taloyhtio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_ad.css" rel="stylesheet">
<style>
  /* Pystymitta on ohitettava: _ad.css pakottaa 1080×1350. */
  html,body{width:1080px;height:1920px}
  body{background:#12301F}

  /* Säteittäinen tausta: keskeltä vaaleampi, reunoilta syvä — sama valo-osuma
     kuin esikuvassa, TiivisKotin vihreällä (#217A4E) sinisen sijaan. */
  .bg{position:absolute;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 78% 46% at 50% 44%, #2E8A5B 0%, #226B47 34%, #17462E 66%, #12301F 100%);}
  .bgv{position:absolute;inset:0;z-index:1;pointer-events:none;
    box-shadow:inset 0 0 320px 90px rgba(9,26,17,.55)}

  /* Reelsin käyttöliittymä syö ylhäältä ~250 px ja alhaalta ~400 px
     (sama turvarajaus kuin video/brand.ts). Sisältö pysyy niiden välissä. */
  .stack{position:absolute;left:0;right:0;top:250px;bottom:400px;z-index:3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 76px;text-align:center}

  .chip{display:inline-block;
    font-size:31px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;
    color:rgba(255,255,255,.92);
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);
    padding:15px 34px;border-radius:999px;margin-bottom:40px}

  .title{font-weight:800;font-size:112px;line-height:1.04;letter-spacing:-.035em;
    color:#fff;text-wrap:balance}
  /* Keskirivi kantaa korostusvärin — juuri se erottaa kaavan tavallisesta
     otsikosta: silmä pysähtyy siihen sanaan josta kauppa on kiinni. */
  .title .hl{color:#8FD3AC;display:block}

  .sub{margin-top:38px;font-size:39px;font-weight:600;line-height:1.34;
    color:rgba(255,255,255,.62);max-width:820px}

  /* Esikuvassa brändi näkyy vain profiilista. Maksetussa mainoksessa se ei
     riitä, joten tunnus on alalaidassa — mutta turvarajan yläpuolella. */
  .sign{position:absolute;left:0;right:0;bottom:430px;z-index:3;
    display:flex;align-items:center;justify-content:center;gap:16px;opacity:.95}
  .sign svg{width:56px;height:56px;display:block}
  .sign .wm{font-weight:800;font-size:40px;letter-spacing:-.03em;color:#fff}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bgv"></div>

  <div class="stack">
    <span class="chip">Asutko taloyhtiössä?</span>
    <h1 class="title">Näin saat<span class="hl">tiivistykset</span>taloyhtiöön</h1>
    <p class="sub">Maksuton kartoitus, yksi yhteyshenkilö</p>
  </div>

  <div class="sign">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span class="wm">TiivisKoti</span>
  </div>
</body></html>
