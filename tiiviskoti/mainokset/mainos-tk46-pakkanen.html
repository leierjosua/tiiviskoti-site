<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — TK46 pakkanen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_niukka.css" rel="stylesheet">
</head>
<body>
  <!-- TK46 — KAUSIVASTAVAITE. Sama vastavaite jota seka AaltoAir etta
       KilpiLasi ajavat omana mainoksenaan ("Luulin etta pitaa odottaa
       kevaaseen") - se tarkoittaa etta molemmat ovat mitanneet sen
       toimivaksi. Meidan versiomme lisaa syyn miksi odottaminen maksaa. -->
  <div class="photo"><img src="kuvat/vid-keittio-ikkuna.jpg" alt=""></div>
  <div class="wash"></div>
  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>
  <div class="block">
    <h1><span class="hl">Miksi odottaa<br>kevääseen?</span><br><span class="anchor">Veto maksaa joka pakkaspäivä.</span></h1>
    <p class="sub">Työ tehdään sisäkautta · noin 20 min ikkunaa kohti</p>
    <span class="btn">Varaa aika
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
</body></html>
