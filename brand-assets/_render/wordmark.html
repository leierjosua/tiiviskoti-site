<!DOCTYPE html>
<html lang="fi"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;}
  .wrap{display:inline-block;padding:40px 50px;}
  .wm{font-family:'Gabarito';font-weight:700;font-size:120px;letter-spacing:-2.2px;line-height:1;white-space:nowrap;display:inline-flex;align-items:baseline;}
  .bo{display:inline-block;width:0.605em;height:0.605em;vertical-align:-0.055em;margin:0 0.004em;overflow:visible;}
  .pb{display:inline-block;width:0.26em;height:0.605em;vertical-align:-0.055em;overflow:visible;}
</style></head>
<body>
<div class="wrap"><div class="wm" id="wm"></div></div>
<script>
  const DEEP = window.location.hash === '#dark' ? '#ffffff' : '#0B3A66';
  const BRIGHT = window.location.hash === '#dark' ? '#5AB7F5' : '#1B9DF0';
  const RINGD = window.location.hash === '#dark' ? '#ffffff' : '#0B3A66';
  const HID = window.location.hash === '#dark' ? '#9fd8fb' : '#ffffff';
  document.getElementById('wm').innerHTML = `
    <span style="color:${DEEP}">L</span>
    <svg class="bo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="${RINGD}" stroke-width="22"/><path d="M19 30 A38 38 0 0 1 38 14" fill="none" stroke="${HID}" stroke-width="9" stroke-linecap="round"/></svg>
    <span style="color:${DEEP}">ppu</span>
    <span style="color:${BRIGHT}">siiv</span>
    <svg class="bo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="${BRIGHT}" stroke-width="22"/><path d="M19 30 A38 38 0 0 1 38 14" fill="none" stroke="${window.location.hash==='#dark'?'#fff':'#fff'}" stroke-width="9" stroke-linecap="round"/><circle cx="92" cy="6" r="8" fill="#2BB3F7"/><circle cx="104" cy="-10" r="4.5" fill="#7FD0FA"/></svg>
    <span style="color:${BRIGHT}">us</span>
    <svg class="pb" viewBox="0 0 26 100"><circle cx="13" cy="84" r="12" fill="${BRIGHT}"/><circle cx="9" cy="80" r="3.5" fill="#fff"/></svg>
    <span style="color:${DEEP}">fi</span>`;
</script>
</body></html>
