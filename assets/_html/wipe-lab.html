<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  body{background:#EAF2FA;padding:0;display:block;width:1140px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:30px;padding:34px 50px;border-bottom:1px solid #d7e4f1}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 170px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.45}
  .tag small{display:block;font-weight:400;color:#7d95ad;margin-top:3px;font-size:12px}
  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap;display:inline-block;position:relative;font-size:70px}
  .ink{color:#0B3A66}.bl{color:#1B9DF0}
  .b{position:relative;display:inline-block}
  .wipe{position:absolute;left:0;bottom:-.15em;width:100%;overflow:visible}
  .bub{display:inline-block;width:.30em;height:.30em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .015em}
  .bub::after{content:"";position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.9);left:18%;top:15%}
</style></head>
<body>

<!-- L1 ohut -->
<div class="row"><div class="tag">L1 · Ohut<small>C, hiukan ohuempi</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" style="height:.30em" viewBox="0 0 208 16" preserveAspectRatio="none"><path d="M6 10 C58 6 138 5 186 4 C194 3.6 199 2.2 202 .6 C200 4 196 5.2 189 5.6 C138 8 58 9 9 12.5 C2.5 13 .5 10 6 10 Z" fill="#1B9DF0"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
</div>

<!-- L2 suippo -->
<div class="row"><div class="tag">L2 · Suippo pääty<small>ohenee neulanteräväksi</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" style="height:.30em" viewBox="0 0 214 16" preserveAspectRatio="none"><path d="M5 10 C58 6 140 5 196 3 C204 2.6 209 1.4 212 0 C209 3 203 4 195 4.6 C140 7 58 9 9 12.5 C2.5 13 -.5 10 5 10 Z" fill="#1B9DF0"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
</div>

<!-- L3 flick -->
<div class="row"><div class="tag">L3 · Flick<small>pääty nousee kevyesti</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" style="height:.34em;bottom:-.18em" viewBox="0 0 214 20" preserveAspectRatio="none"><path d="M6 13 C58 9 134 8 184 6 C196 5.4 204 3.6 211 .5 C207 4.6 200 7 192 8.4 C140 11 58 12 9 15.5 C2.5 16 .5 13 6 13 Z" fill="#1B9DF0"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
</div>

<!-- L4 tuplaviiva (motion) -->
<div class="row"><div class="tag">L4 · Vauhtiviiva<small>ohut + häivähdys</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" style="height:.40em;bottom:-.20em" viewBox="0 0 208 22" preserveAspectRatio="none"><path d="M6 14 C58 10 138 9 186 8 C194 7.6 199 6.2 202 4.6 C200 8 196 9.2 189 9.6 C138 12 58 13 9 16.5 C2.5 17 .5 14 6 14 Z" fill="#1B9DF0"/><path d="M2 3 C30 1.6 70 1.2 98 1.6 C92 3 60 3.6 8 5.6 C3 5.8 1 3.4 2 3 Z" fill="#5AB7F5" opacity=".75"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
</div>

<!-- L5 koko sanan alla -->
<div class="row"><div class="tag">L5 · Koko sana<small>ohut veto .fi:n alle</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b"><span class="bl">siivous</span><span class="bub"></span><span class="ink">fi</span><svg class="wipe" style="height:.30em" viewBox="0 0 300 16" preserveAspectRatio="none"><path d="M5 10 C90 6 200 5 282 4 C290 3.6 295 2.2 298 .6 C296 4 290 5.2 282 5.6 C200 8 90 9 9 12.5 C2.5 13 -.5 10 5 10 Z" fill="#1B9DF0"/></svg></span></span>
</div>

</body></html>
