<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{background:#EFF4F8;font-family:'Avenir Next';padding:44px;display:flex;gap:40px;flex-wrap:wrap;align-items:center}
.tile{background:#fff;border-radius:18px;padding:34px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;gap:14px}
.tile.dark{background:#0A1F3C}.lab{font-size:12px;font-weight:700;color:#9aa3ad}</style></head><body>
<svg width="0" height="0"><defs>
  <path id="top" d="M30,100 A70,70 0 0 1 170,100"/>
  <path id="bot" d="M30,100 A70,70 0 0 0 170,100"/>
</defs></svg>
<script>
function stamp(color, rot){
  return `<svg width="240" height="240" viewBox="0 0 200 200"><g transform="rotate(${rot} 100 100)">
    <circle cx="100" cy="100" r="80" fill="none" stroke="${color}" stroke-width="3.5"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="${color}" stroke-width="1.5"/>
    <text font-family="Gabarito" font-weight="800" font-size="13.5" letter-spacing="2.6" fill="${color}" text-anchor="middle"><textPath href="#top" startOffset="50%">LOPPUSIIVOUS.FI</textPath></text>
    <text font-family="Gabarito" font-weight="700" font-size="11" letter-spacing="3.4" fill="${color}" text-anchor="middle"><textPath href="#bot" startOffset="50%">MUUTTOSIIVOUS</textPath></text>
    <circle cx="28" cy="100" r="2.6" fill="${color}"/><circle cx="172" cy="100" r="2.6" fill="${color}"/>
    <path d="M83 68 l10 11 25 -29" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="110" font-family="Gabarito" font-weight="900" font-size="22" letter-spacing="0.3" fill="${color}" text-anchor="middle">HYVÄKSYTTY</text>
  </g></svg>`;
}
document.write(`<div class="tile">${stamp('#0A1F3C',-8)}<div class="lab">A · navy</div></div>`);
document.write(`<div class="tile">${stamp('#1B9DF0',-8)}<div class="lab">B · sininen</div></div>`);
document.write(`<div class="tile dark">${stamp('#ffffff',-8)}<div class="lab">C · valkoinen (tummalle)</div></div>`);
</script>
</body></html>
