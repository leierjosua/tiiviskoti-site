<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — TK49 mita 149 sisaltaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_paneeli.css" rel="stylesheet">
</head>
<body>
  <!-- TK49 HINTAVASTAVAITE. "Pienin kaynti" ei kerro mista palvelusta on kyse,
       joten otsikko nimeaa sen ensin. -->
  <div class="photo"><img src="kuvat/ad-ikkuna-suora.jpg" alt=""></div>
  <div class="wash"></div>
  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>
  <div class="block">
    <h1>Ikkunoiden tiivistys:<br><span class="hl">pienin käynti 149 €.</span></h1>
    <div class="rows">
      <div class="row"><span class="lbl">3 ikkunaa</span><span class="val">270 €</span></div>
      <div class="row"><span class="lbl">5 ikkunaa</span><span class="val">425 €</span></div>
      <div class="row key"><span class="lbl">10 ikkunaa</span><span class="val">800 €</span></div>
    </div>
    <p class="foot">Sisältää käynnin, matkat ja lämpökamerakuvauksen. Ei matkalisää.</p>
    <span class="btn">Katso oma hintasi
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
</body></html>
