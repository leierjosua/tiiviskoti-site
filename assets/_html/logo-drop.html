<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{background:#EAF2FA;display:block;width:920px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:28px;padding:32px 50px;border-bottom:1px solid #d7e4f1}
  .tag{flex:0 0 130px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.4}
  .tag small{display:block;font-weight:400;color:#7d95ad;margin-top:3px;font-size:11px}
  .ico{flex:0 0 auto;width:62px;height:62px}
  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.035em;line-height:1;white-space:nowrap;display:inline-block;position:relative;font-size:48px}
  .d{color:#0B3A66}.bl{color:#1B9DF0}
  .b{position:relative;display:inline-block}
  .wipe{position:absolute;left:-3%;bottom:-.30em;width:106%;height:.26em;overflow:visible}
  .bub{display:inline-block;width:.28em;height:.28em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .02em}
  .bub i{position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.92);left:18%;top:15%}
  .chips{display:flex;gap:10px;margin-left:auto}
  .chip{width:46px;height:46px;border-radius:11px;display:grid;place-items:center}
  .cw{background:#fff;border:1px solid #d4e3f1}.cn{background:#0A1F3C}
  .chip svg{width:34px;height:34px}
</style></head>
