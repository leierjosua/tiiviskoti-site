<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  body{background:#fff;padding:0;display:block;width:1040px;font-family:'Gabarito'}
  .band{padding:54px 60px;display:flex;flex-direction:column;gap:46px}
  .light{background:#EAF2FA}
  .dark{background:#0A1F3C}
  .cap{font-family:'Inter';font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7d95ad;margin-bottom:-22px}
  .dark .cap{color:#6b88a8}
  .unit{display:flex;align-items:center;gap:22px}
  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap;display:inline-block;position:relative;font-size:64px}
  .ink{color:#0B3A66}.bl{color:#1B9DF0}
  .dark .ink{color:#fff}.dark .bl{color:#5AB7F5}
  .b{position:relative;display:inline-block}
  .wipe{position:absolute;left:0;bottom:-.15em;width:100%;height:.30em;overflow:visible}
  .bub{display:inline-block;width:.30em;height:.30em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .015em}
  .bub::after{content:"";position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.9);left:18%;top:15%}
  .dark .bub{background:#5AB7F5}
  .ico{flex:0 0 auto;width:78px;height:72px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="sq" viewBox="0 0 104 92">
    <g transform="rotate(34 54 44)">
      <rect x="47" y="2" width="14" height="9" rx="4.5" class="p"/>
      <rect x="50.5" y="9" width="7" height="29" rx="3.5" class="p"/>
      <rect x="32" y="37" width="44" height="8" rx="4" class="p"/>
      <rect x="35" y="45" width="38" height="5" rx="2.5" class="a"/>
    </g>
    <path d="M8 72 C36 61 74 59 98 62 C104 62.6 100 68 92 68.5 C68 70 38 72 12 80 C4 82 2 74 8 72 Z" class="a"/>
  </symbol>
</defs></svg>

<style>
  .ico .p{fill:#0B3A66}.ico .a{fill:#1B9DF0}
  .dark .ico .p{fill:#fff}.dark .ico .a{fill:#5AB7F5}
</style>

<!-- LIGHT -->
<div class="band light">
  <div class="cap">1 · Ilman ikonia</div>
  <div class="unit">
    <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" viewBox="0 0 214 16" preserveAspectRatio="none"><path d="M5 10 C58 6 140 5 196 3 C204 2.6 209 1.4 212 0 C209 3 203 4 195 4.6 C140 7 58 9 9 12.5 C2.5 13 -.5 10 5 10 Z" fill="#1B9DF0"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
  </div>
  <div class="cap">2 · Squeegee-ikonin kanssa</div>
  <div class="unit">
    <svg class="ico" viewBox="0 0 104 92"><g transform="rotate(34 54 44)"><rect x="47" y="2" width="14" height="9" rx="4.5" fill="#0B3A66"/><rect x="50.5" y="9" width="7" height="29" rx="3.5" fill="#0B3A66"/><rect x="32" y="37" width="44" height="8" rx="4" fill="#0B3A66"/><rect x="35" y="45" width="38" height="5" rx="2.5" fill="#1B9DF0"/></g><path d="M8 72 C36 61 74 59 98 62 C104 62.6 100 68 92 68.5 C68 70 38 72 12 80 C4 82 2 74 8 72 Z" fill="#1B9DF0"/></svg>
    <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" viewBox="0 0 214 16" preserveAspectRatio="none"><path d="M5 10 C58 6 140 5 196 3 C204 2.6 209 1.4 212 0 C209 3 203 4 195 4.6 C140 7 58 9 9 12.5 C2.5 13 -.5 10 5 10 Z" fill="#1B9DF0"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
  </div>
</div>

<!-- DARK -->
<div class="band dark">
  <div class="cap">1 · Ilman ikonia · tumma</div>
  <div class="unit">
    <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" viewBox="0 0 214 16" preserveAspectRatio="none"><path d="M5 10 C58 6 140 5 196 3 C204 2.6 209 1.4 212 0 C209 3 203 4 195 4.6 C140 7 58 9 9 12.5 C2.5 13 -.5 10 5 10 Z" fill="#5AB7F5"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
  </div>
  <div class="cap">2 · Ikonin kanssa · tumma</div>
  <div class="unit">
    <svg class="ico" viewBox="0 0 104 92"><g transform="rotate(34 54 44)"><rect x="47" y="2" width="14" height="9" rx="4.5" fill="#fff"/><rect x="50.5" y="9" width="7" height="29" rx="3.5" fill="#fff"/><rect x="32" y="37" width="44" height="8" rx="4" fill="#fff"/><rect x="35" y="45" width="38" height="5" rx="2.5" fill="#5AB7F5"/></g><path d="M8 72 C36 61 74 59 98 62 C104 62.6 100 68 92 68.5 C68 70 38 72 12 80 C4 82 2 74 8 72 Z" fill="#5AB7F5"/></svg>
    <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" viewBox="0 0 214 16" preserveAspectRatio="none"><path d="M5 10 C58 6 140 5 196 3 C204 2.6 209 1.4 212 0 C209 3 203 4 195 4.6 C140 7 58 9 9 12.5 C2.5 13 -.5 10 5 10 Z" fill="#5AB7F5"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
  </div>
</div>

</body></html>
