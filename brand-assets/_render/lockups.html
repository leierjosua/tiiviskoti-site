<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; }
  .sheet { display:flex; flex-direction:column; }
  .lockup {
    display:flex; align-items:center; gap:30px;
    padding:60px 80px; width:1100px;
    font-family:'Avenir Next','Inter',sans-serif;
  }
  .mark { flex:0 0 auto; }
  .word { display:flex; flex-direction:column; line-height:1; }
  .name { font-weight:800; font-size:84px; letter-spacing:-2.5px; }
  .tag  { font-weight:600; font-size:23px; letter-spacing:7px; margin-top:14px; text-transform:uppercase; }
</style>
</head>
<body>
<div class="sheet" id="sheet">

  <!-- ============ 1. RAIKAS AQUA / TEAL ============ -->
  <div class="lockup" id="d1-light" style="background:#ffffff;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#13C2C8"/><stop offset="1" stop-color="#0E7C86"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="128" height="128" rx="32" fill="url(#g1)"/>
      <path d="M40 32 v52 a4 4 0 0 0 4 4 h44" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M92 30 C95 47,103 55,120 58 C103 61,95 69,92 86 C89 69,81 61,64 58 C81 55,89 47,92 30 Z" fill="#6FE9D0"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#0B2B30;">Loppusiivous</div>
      <div class="tag"  style="color:#0E7C86;">Muuttosiivoukset</div>
    </div>
  </div>
  <div class="lockup" id="d1-dark" style="background:#0B2B30;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <rect x="2" y="2" width="128" height="128" rx="32" fill="url(#g1)"/>
      <path d="M40 32 v52 a4 4 0 0 0 4 4 h44" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M92 30 C95 47,103 55,120 58 C103 61,95 69,92 86 C89 69,81 61,64 58 C81 55,89 47,92 30 Z" fill="#6FE9D0"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#ffffff;">Loppusiivous</div>
      <div class="tag"  style="color:#6FE9D0;">Muuttosiivoukset</div>
    </div>
  </div>

  <!-- ============ 2. SYVÄ NAVY + KULTA ============ -->
  <div class="lockup" id="d2-light" style="background:#F5F1E8;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <path d="M66 4 L122 22 V64 C122 96 98 118 66 128 C34 118 10 96 10 64 V22 Z" fill="#0E2038" stroke="#C9A24B" stroke-width="3"/>
      <text x="66" y="86" font-family="'Avenir Next','Inter',serif" font-weight="800" font-size="58" letter-spacing="-2" text-anchor="middle" fill="#C9A24B">LS</text>
      <path d="M66 24 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#C9A24B"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#0E2038;">Loppusiivous</div>
      <div class="tag"  style="color:#A67C28; letter-spacing:9px;">Muuttosiivoukset</div>
    </div>
  </div>
  <div class="lockup" id="d2-dark" style="background:#0E2038;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <path d="M66 4 L122 22 V64 C122 96 98 118 66 128 C34 118 10 96 10 64 V22 Z" fill="#16263F" stroke="#C9A24B" stroke-width="3"/>
      <text x="66" y="86" font-family="'Avenir Next','Inter',serif" font-weight="800" font-size="58" letter-spacing="-2" text-anchor="middle" fill="#C9A24B">LS</text>
      <path d="M66 24 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#C9A24B"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#F5F1E8;">Loppusiivous</div>
      <div class="tag"  style="color:#C9A24B; letter-spacing:9px;">Muuttosiivoukset</div>
    </div>
  </div>

  <!-- ============ 3. TUORE VIHREÄ ============ -->
  <div class="lockup" id="d3-light" style="background:#ffffff;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#27B56E"/><stop offset="1" stop-color="#0E6B3C"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="128" height="128" rx="32" fill="url(#g3)"/>
      <path d="M40 32 v52 a4 4 0 0 0 4 4 h44" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M96 26 C72 30 66 48 70 66 C92 64 100 46 96 26 Z" fill="#A8E6B0"/>
      <path d="M84 40 C80 50 76 58 72 64" fill="none" stroke="#0E6B3C" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#0C2A1C;">Loppusiivous</div>
      <div class="tag"  style="color:#0E6B3C;">Muuttosiivoukset</div>
    </div>
  </div>
  <div class="lockup" id="d3-dark" style="background:#0C2A1C;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <rect x="2" y="2" width="128" height="128" rx="32" fill="url(#g3)"/>
      <path d="M40 32 v52 a4 4 0 0 0 4 4 h44" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M96 26 C72 30 66 48 70 66 C92 64 100 46 96 26 Z" fill="#A8E6B0"/>
      <path d="M84 40 C80 50 76 58 72 64" fill="none" stroke="#0E6B3C" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#ffffff;">Loppusiivous</div>
      <div class="tag"  style="color:#A8E6B0;">Muuttosiivoukset</div>
    </div>
  </div>

  <!-- ============ 4. SININEN + ORANSSI ============ -->
  <div class="lockup" id="d4-light" style="background:#ffffff;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2C77DA"/><stop offset="1" stop-color="#1763C7"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="128" height="128" rx="32" fill="url(#g4)"/>
      <path d="M40 32 v52 a4 4 0 0 0 4 4 h44" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M93 30 C96 47,104 55,121 58 C104 61,96 69,93 86 C90 69,82 61,65 58 C82 55,90 47,93 30 Z" fill="#FF7A1A"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#0C2747;">Loppusiivous</div>
      <div class="tag"  style="color:#1763C7;">Muuttosiivoukset</div>
    </div>
  </div>
  <div class="lockup" id="d4-dark" style="background:#0C2747;">
    <svg class="mark" width="132" height="132" viewBox="0 0 132 132">
      <rect x="2" y="2" width="128" height="128" rx="32" fill="url(#g4)"/>
      <path d="M40 32 v52 a4 4 0 0 0 4 4 h44" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M93 30 C96 47,104 55,121 58 C104 61,96 69,93 86 C90 69,82 61,65 58 C82 55,90 47,93 30 Z" fill="#FF7A1A"/>
    </svg>
    <div class="word">
      <div class="name" style="color:#0C2747;">Loppusiivous</div>
      <div class="tag"  style="color:#FF7A1A;">Muuttosiivoukset</div>
    </div>
  </div>

</div>
</body>
</html>
