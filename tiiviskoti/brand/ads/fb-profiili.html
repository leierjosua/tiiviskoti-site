<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>TiivisKoti — Facebook-profiilikuva ja kansikuva</title>
<!--
  FACEBOOK-PROFIILI

  RENDERÖINTI
    node tiiviskoti/brand/ads/build-fb-profiili.mjs   (repon juuresta)
    Vaatii dev-palvelimen: cd tiiviskoti && node _serve.mjs
    Tuottaa: brand/fb-profiilikuva-1080.png, brand/fb-kansikuva-1640x856.png

  PROFIILIKUVA · 1080 × 1080
    Vain merkki, ei nimeä — Facebook rajaa kuvan ympyräksi ja näyttää sen
    syötteessä n. 32 px kokoisena, jolloin teksti ei erotu. Sivun nimi näkyy
    joka tapauksessa kuvan vieressä.
    Merkki pidetään n. 55 % leveydestä, jotta ympyrärajaus ei leikkaa sitä.
    Tausta on brändivihreä eikä tummin vihreä: 32 px koossa tummin vihreä
    näyttää mustalta eikä erotu muista.

  KANSIKUVA · 1640 × 856
    Facebook näyttää työpöydällä koko kuvan, puhelimessa vain keskimmäiset
    n. 75 % leveydestä. Siksi kaikki teksti on keskitetty .safe-alueelle.
    Työpöydällä profiilikuva peittää vasemman alakulman, joten alalaita
    pidetään tyhjänä.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#217A4E; --green-l:#2E9E63; --deep:#163A28; --bg:#F6F7F3;
  --dtext:#D7E4DB; --amber:#E0A63A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#8f9a92;font-family:Manrope,system-ui,sans-serif;
  display:flex;flex-direction:column;gap:36px;padding:36px;align-items:flex-start}

/* ---------- PROFIILIKUVA ----------
   14.10.2026 Josua: nimi logon alle meidän fontilla (vrt. AaltoAirin logo).
   Kaikki pysyy ympyrän sisään piirretyn neliön (≈70 %) sisällä. */
#fb-profiili{width:1080px;height:1080px;background:var(--green);flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
#fb-profiili svg{width:430px;height:430px;display:block;margin-top:-20px}
#fb-profiili .wm{font-size:150px;font-weight:800;letter-spacing:-.035em;line-height:1;color:#fff}
#fb-profiili .wm i{font-style:normal;color:#A9E3C3}

/* ympyrärajauksen apuviiva — ei renderöidy PNG:hen, vain esikatseluun */
.guide{position:absolute;inset:0;border-radius:50%;
  border:2px dashed rgba(255,255,255,.35);pointer-events:none}
.wrapguide{position:relative;flex:none}

/* ---------- KANSIKUVA ----------
   14.10.2026: porukka näkyviin. Vanha versio peitti kuvan 80–93 %:n
   tummennuksella, jolloin kansikuva oli käytännössä vihreä tekstilaatta.
   Nyt kuva on kirkkaana oikealla ja teksti omalla paneelillaan vasemmalla.
   Teksti alkaa vasta x≈150:stä (puhelin rajaa reunoja) ja paneelin alaosa
   on tyhjä, koska työpöydällä profiilikuva peittää vasemman alakulman. */
#fb-kansikuva{width:1640px;height:856px;position:relative;overflow:hidden;background:var(--deep);flex:none}
#fb-kansikuva .photo{position:absolute;top:0;right:0;bottom:0;width:1080px}
#fb-kansikuva .photo img{width:100%;height:100%;object-fit:cover;object-position:62% 40%;display:block}
#fb-kansikuva .fade{position:absolute;top:0;bottom:0;left:560px;width:260px;
  background:linear-gradient(90deg,var(--deep) 0%,rgba(22,58,40,.75) 40%,rgba(22,58,40,0) 100%)}
#fb-kansikuva .panel{position:absolute;left:150px;top:118px;width:560px;
  display:flex;flex-direction:column;align-items:flex-start}

.lockup{display:flex;align-items:center;gap:16px;margin-bottom:46px}
.lockup svg{width:60px;height:60px;display:block}
.lockup span{font-size:40px;font-weight:800;color:#fff;letter-spacing:-.02em}
.lockup span i{font-style:normal;color:#A9E3C3}

#fb-kansikuva h1{font-size:76px;font-weight:800;color:#fff;line-height:1.02;
  letter-spacing:-.035em;margin-bottom:22px}
#fb-kansikuva h1 em{font-style:normal;color:#A9E3C3}
#fb-kansikuva .tag{font-size:27px;font-weight:600;color:var(--dtext);line-height:1.4;margin-bottom:30px}

.facts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:34px}
.fact{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  border-radius:99px;padding:10px 22px;font-size:24px;font-weight:700;color:#fff}
.contactline{display:flex;flex-direction:column;gap:6px;font-size:32px;font-weight:800}
.contactline .dom{color:#fff}
.contactline .tel{color:#A9E3C3}
</style>
</head>
<body>

<!-- ============ PROFIILIKUVA 1080 × 1080 ============ -->
<div class="wrapguide">
  <div id="fb-profiili">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="14" y="14" width="72" height="72" rx="18" fill="none" stroke="#F6F7F3" stroke-width="6"/>
      <rect x="34" y="30" width="32" height="40" rx="2.5" fill="none" stroke="#F6F7F3" stroke-width="5"/>
      <rect x="37.5" y="30" width="3.4" height="40" fill="#F6F7F3"/>
    </svg>
    <div class="wm">Tiivis<i>Koti</i></div>
  </div>
  <div class="guide"></div>
</div>

<!-- ============ KANSIKUVA 1640 × 856 ============ -->
<div id="fb-kansikuva">
  <div class="photo"><img src="../kuvat/fb-kansi-photo.jpg" alt=""></div>
  <div class="fade"></div>
  <div class="panel">
    <div class="lockup">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#2E9E63"/><rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#F6F7F3" stroke-width="5"/><rect x="35" y="20" width="4" height="60" fill="#F6F7F3"/></svg>
      <span>Tiivis<i>Koti</i></span>
    </div>
    <h1>Ovien ja ikkunoiden <em>tiivistys</em></h1>
    <p class="tag">Kiinteä hinta · oma porukka · koko Uusimaa</p>
    <div class="facts">
      <span class="fact">Ikkuna alk. 75 €</span>
      <span class="fact">Ulko-ovi 99 €</span>
    </div>
    <div class="contactline">
      <span class="dom">tiiviskoti.fi</span>
      <span class="tel">045 7831 1972</span>
    </div>
  </div>
</div>

</body>
</html>
