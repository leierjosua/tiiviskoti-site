<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>TiivisKoti — Google-yritysprofiilin kansikuva</title>
<!--
  GOOGLE-YRITYSPROFIILIN KANSIKUVA · 1200 × 675

  RENDERÖINTI
    node tiiviskoti/brand/ads/build-google-yritysprofiili.mjs   (repon juuresta)
    Vaatii dev-palvelimen: cd tiiviskoti && node _serve.mjs
    Tuottaa: brand/google-kansikuva-1200x675.png

  VALOKUVA (muutettu 24.8.2026)
    Aiemmin kansikuva oli pelkkä brändigrafiikka, koska sivuston kuvat olivat
    kuvapankista: ne esittivät taloja jotka eivät olleet meidän eivätkä
    työkohteitamme, eikä sellaista voi laittaa yritysprofiiliin. 24.8.2026
    kuvattu oma materiaali poistaa esteen — kuvassa on oma porukka omissa
    työvaatteissa oikeassa kohteessa, joten se esittää yritystä aidosti.

  KESKITETTY LAYOUT
    Google rajaa kansikuvaa eri suhteisiin eri paikoissa (haku, Maps, mobiili).
    Kaikki sisältö on siksi keskitetty ja reunoille on jätetty reilu marginaali,
    jotta tiukempikaan rajaus ei leikkaa tekstiä.

  TEKSTIN MÄÄRÄ
    Kuva näkyy hakutuloksissa pienenä, joten rivejä on vain kolme. Puhelinnumero
    ja aukioloajat tulevat profiilin omista kentistä — niitä ei toisteta kuvaan,
    koska ne vanhenevat kuvassa eivätkä profiilissa.

  LOGO (720 × 720)
    Renderöityy samalla ajolla: #google-logo → brand/google-logo-720.png.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#217A4E; --green-l:#2E9E63; --deep:#163A28; --bg:#F6F7F3;
  --dtext:#D7E4DB; --amber:#E0A63A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#8f9a92;font-family:Manrope,system-ui,sans-serif;
  padding:36px;display:flex;flex-direction:column;align-items:flex-start}

#google-kansikuva{
  width:1200px;height:675px;flex:none;position:relative;overflow:hidden;
  background:var(--deep);
  display:flex;align-items:center;justify-content:center;
}
#google-kansikuva .photo{position:absolute;inset:0;z-index:0}
#google-kansikuva .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 46%;display:block}
/* Tumma kalvo: teksti on valkoista, ja hakutuloksissa kuva näkyy pienenä.
   Ilman kalvoa vaalea julkisivu söisi otsikon luettavuuden. */
#google-kansikuva .scrim{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(22,58,40,.82) 0%,rgba(22,58,40,.74) 46%,rgba(22,58,40,.90) 100%)}

/* LOGORUUTU 720 × 720 — yritysprofiilin pyöreä logopaikka */
#google-logo{width:720px;height:720px;flex:none;background:var(--green);
  display:flex;align-items:center;justify-content:center;margin-top:36px}
#google-logo svg{width:400px;height:400px;display:block}

/* Pehmeä valo ylävasemmalta: pelkkä tasainen vihreä näyttää pienennettynä
   litteältä, tämä antaa syvyyttä ilman että mikään vie huomiota tekstiltä. */
#google-kansikuva .glow{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(120% 100% at 22% 8%, rgba(46,158,99,.55) 0%, rgba(46,158,99,0) 62%),
    radial-gradient(90% 90% at 92% 100%, rgba(33,122,78,.40) 0%, rgba(33,122,78,0) 60%);}

/* Turva-alue: sisältö pysyy keskimmäisessä 76 %:ssa, jolloin sivuilta voi
   rajautua pois reilusti ilman että teksti kärsii. */
.safe{position:relative;z-index:2;width:76%;text-align:center;
  display:flex;flex-direction:column;align-items:center}

.lockup{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.lockup svg{width:52px;height:52px;display:block}
.lockup span{font-size:36px;font-weight:800;color:#fff;letter-spacing:-.02em}
.lockup span i{font-style:normal;color:var(--green-l)}

#google-kansikuva h1{font-size:64px;font-weight:800;color:#fff;line-height:1.06;
  letter-spacing:-.03em;margin-bottom:26px}

/* Ohut amber-viiva erottaa lupauksen otsikosta. Amber on brändin ainoa
   lämmin sävy ja toimii pienessäkin koossa, koska se on viivana eikä tekstinä. */
.rule{width:78px;height:4px;border-radius:99px;background:var(--amber);margin-bottom:26px}

.tag{font-size:29px;font-weight:600;color:var(--dtext);letter-spacing:-.01em}
.tag b{color:#fff;font-weight:800}
.tag .dot{color:rgba(255,255,255,.38);margin:0 14px}
</style>
</head>
<body>

<!-- ============ GOOGLEN KANSIKUVA 1200 × 675 ============ -->
<div id="google-kansikuva">
  <div class="photo"><img src="../kuvat/google-kansi-photo.jpg" alt=""></div>
  <div class="scrim"></div>
  <div class="glow" style="opacity:.5"></div>
  <div class="safe">
    <div class="lockup">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#2E9E63"/><rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#F6F7F3" stroke-width="5"/><rect x="35" y="20" width="4" height="60" fill="#F6F7F3"/></svg>
      <span>Tiivis<i>Koti</i></span>
    </div>
    <h1>Ovien ja ikkunoiden<br>tiivistys</h1>
    <div class="rule"></div>
    <p class="tag">Uusimaa<span class="dot">·</span>alkaen <b>149 €</b></p>
  </div>
</div>

<!-- ============ LOGORUUTU 720 × 720 ============ -->
<div id="google-logo">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <rect x="14" y="14" width="72" height="72" rx="18" fill="none" stroke="#F6F7F3" stroke-width="6"/>
    <rect x="34" y="30" width="32" height="40" rx="2.5" fill="none" stroke="#F6F7F3" stroke-width="5"/>
    <rect x="37.5" y="30" width="3.4" height="40" fill="#F6F7F3"/>
  </svg>
</div>

</body>
</html>
