<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — niukka mainos: mainos-niukka-liidi-ikkuna-ankkuri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_niukka.css" rel="stylesheet">
</head>
<body>
  <!-- Variantti voittavasta ankkurikulmasta (TK31), kohteena ikkuna.
       MIKSI SAMA KULMA ERI KOHTEELLA: TK31 on ainoa liidejä tuottanut
       mainos (30 €/liidi), ja sen idea on hintavertailu — ei ovi. Ikkuna
       on Googlessa suurempi hakuvolyymi kuin ovi, joten sama logiikka
       kannattaa testata siihen ennen kuin kulmaa vaihdetaan.
       Luku 1 200 € on yhden ikkunan vaihto asennettuna, ei koko talon.
       OMIA YKSIKKÖHINTOJA EI MAINITA (ei 95 €/ikkuna): mainoksessa luvataan
       vain kiinteä alkaen-hinta, ja tarkka summa lasketaan kohteen mukaan.
       Näin mainos ei lupaa hintaa jota ei voi pitää. -->
  <div class="photo"><img src="kuvat/ad-ikkuna-kulma.jpg" alt=""></div>
  <div class="wash"></div>

  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>

  <div class="block">
    <h1>Uusi ikkuna 1 200 €.<br><span class="hl">Tiivistys alk. 149 €.</span></h1>
    <p class="sub">Jos lasi ja karmi ovat ehjät, tiivisteiden vaihto riittää — veto loppuu samalla käynnillä</p>
    <span class="btn">Pyydä tarjous
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
</body></html>
