    <!-- SÄÄSTÖVÄITTEEN PERUSTE (tarkistettu 19.9.2026).

         Josua pyysi "10–15 %". Sitä EI voi väittää: 10 %:n alaraja tarkoittaa
         lupausta vähimmäissäästöstä, eikä yksikään lähde anna alarajaa.

         Mitä lähteistä oikeasti löytyy:
           · Motiva (valtion energiayhtiö, vahvin lähde) — käsittelee ikkunoiden
             tiivistystä, mutta EI ANNA PROSENTTILUKUA LAINKAAN. Tarkistettu
             sekä ikkunasivu että taloyhtiön energiansäästö -sivu.
           · PKS ja Savon Voima (energiayhtiöt) — otsikossa "voit säästää jopa
             15 % lämmityskuluissa". Ei lähdeviitettä. Savon Voiman leipätekstin
             ainoa numero (1 °C = 5 %) koskee huonelämpötilaa, ei tiivistystä.
           · Rakentaja.fi — "Energiaa säästyy 5–20 %." Ei lähdeviitettä, ja
             juttu on kaupallinen yhteistyö tiivistevalmistaja Rakennuskemian
             kanssa, eli käytännössä toimittajan omaa markkinointia.

         Johtopäätös: kaikki liikkuvat luvut ovat kattoja ("jopa", laaja haarukka),
         eikä yksikään ole lähteistetty. Siksi tässä "jopa 15 %" — sama muotoilu
         kuin oikeilla energiayhtiöillä, ja se on katto eikä lattia.

         Lupauskieli: kohde rajattu (vetoinen talo, alarivi), verbi vahva
         ("säästää", ei "voi säästää"), suuruus katolla. -->
    <h1>Tiivistys säästää<br><span class="hl">jopa 15 % lämmityskuluista.</span></h1>
    <p class="sub">Vetoisessa talossa ero tuntuu jo ensimmäisellä pakkasviikolla.</p>
