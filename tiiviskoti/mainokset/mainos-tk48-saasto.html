<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — TK48 saastolaskelma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_paneeli.css" rel="stylesheet">
</head>
<body>
  <!-- TK48 — SAASTO EUROINA. AaltoAirin tehokkain tekniikka (esimerkkitalo
       joka muuttaa prosentin euroiksi valivaiheineen), mutta MEIDAN
       luvuillamme. 10-15 % on sivuston vakiintunut arvio jolle on
       artikkelissa perustelu; ALA nosta sita AaltoAirin 30-40 %:iin -
       ilmalampopumppu tuottaa lampoa tehokkaammin, tiivistys estaa
       hukkaa. Takaisinmaksu lasketaan VAIN koko talon paketille. -->
  <div class="photo"><img src="kuvat/vid-ikkuna-avaus.jpg" alt=""></div>
  <div class="wash"></div>
  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>
  <div class="block">
    <h1>Mitä 10–15 % on<br><span class="hl">euroina?</span></h1>
    <div class="rows">
      <div class="row"><span class="lbl">Lämmityslasku ennen</span><span class="val">2 000 €</span></div>
      <div class="row"><span class="lbl">Tiivistyksen jälkeen</span><span class="val">~1 750 €</span></div>
      <div class="row"><span class="lbl">Säästö joka vuosi</span><span class="val">200–300 €</span></div>
      <div class="row key"><span class="lbl">Takaisinmaksu</span><span class="val">noin 3 v</span></div>
    </div>
    <p class="foot">Koko talon tiivistys 998 € — kotitalousvähennyksen jälkeen 789 €.</p>
    <span class="btn">Laske oma säästösi
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
</body></html>
