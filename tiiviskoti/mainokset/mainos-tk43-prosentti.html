<html lang="fi"><head>

<body>
  <!-- TK43 — SUHDELUKU. Ainoa luku jota kummallakaan kilpailijalla ei ole.
       Sama ankkuri kuin voittavassa TK37:ssa (uusi ikkuna vs. tiivistys),
       mutta ilmaistuna prosenttina: iso luku tekee hinnasta pienen ilman
       etta hintaa tarvitsee alentaa. 998 EUR = 10 ikkunaa + 2 ulko-ovea,
       12 000 EUR = samojen 10 ikkunan vaihto a 1 200 EUR. Molemmat
       laskettu pricing.mjs:sta 28.9.2026. -->
  <div class="photo"><img src="kuvat/vid-ikkuna-avaus.jpg" alt=""></div>
  <div class="wash"></div>
  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>
  <div class="block">
    <h1><span class="hl">8 % remontin<br>hinnasta.</span><br><span class="anchor">998 € vastaan 12 000 €.</span></h1>
    <p class="sub">Koko talon tiivistys: 10 ikkunaa ja 2 ulko-ovea</p>
    <span class="btn">Laske oma hintasi
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
