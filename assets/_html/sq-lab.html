<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  body{background:#EAF2FA;padding:0;display:block;width:860px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:26px;padding:24px 44px;border-bottom:1px solid #d7e4f1}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 158px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.45}
  .tag small{display:block;font-weight:400;color:#7d95ad;margin-top:3px;font-size:12px}
  .big{width:96px;height:96px}
  .chip{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
  .chip svg{width:34px;height:34px}
  .cw{background:#fff;border:1px solid #dbe7f3}
  .cn{background:#0A1F3C}
  .lab{flex:0 0 36px;font-family:'Inter';font-size:10px;color:#94a8bb;text-align:center;margin-top:2px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

  <!-- R1 long-handle classic -->
  <symbol id="r1" viewBox="0 0 100 92">
    <g transform="rotate(32 50 46)">
      <rect x="43" y="2" width="14" height="9" rx="4.5" fill="#0B3A66"/>
      <rect x="46.5" y="9" width="7" height="31" rx="3.5" fill="#0B3A66"/>
      <rect x="28" y="39" width="44" height="8" rx="4" fill="#0B3A66"/>
      <rect x="31" y="47" width="38" height="5" rx="2.5" fill="#1B9DF0"/>
    </g>
    <path d="M12 74 C36 65 66 63 90 66 C76 71 46 73 16 80 C8 81.5 6 76 12 74 Z" fill="#1B9DF0"/>
  </symbol>

  <!-- R2 dynamic steep angle, handle off corner -->
  <symbol id="r2" viewBox="0 0 100 92">
    <g transform="rotate(42 52 44)">
      <rect x="45" y="-2" width="14" height="9" rx="4.5" fill="#0B3A66"/>
      <rect x="48.5" y="5" width="7" height="33" rx="3.5" fill="#0B3A66"/>
      <rect x="30" y="37" width="44" height="8" rx="4" fill="#0B3A66"/>
      <rect x="33" y="45" width="38" height="5" rx="2.5" fill="#1B9DF0"/>
    </g>
    <path d="M10 76 C34 67 64 65 88 68 C74 73 44 75 14 82 C6 83.5 4 78 10 76 Z" fill="#1B9DF0"/>
  </symbol>

  <!-- R3 duotone blade + drip -->
  <symbol id="r3" viewBox="0 0 100 92">
    <g transform="rotate(30 50 46)">
      <rect x="43" y="2" width="14" height="9" rx="4.5" fill="#0B3A66"/>
      <rect x="46.5" y="9" width="7" height="31" rx="3.5" fill="#0B3A66"/>
      <rect x="27" y="39" width="46" height="8" rx="4" fill="#1B9DF0"/>
      <rect x="30" y="47" width="40" height="4.5" rx="2.2" fill="#0B3A66"/>
    </g>
    <circle cx="36" cy="74" r="4.2" fill="#1B9DF0"/>
    <path d="M36 64 C40 67 40 71 36 74 C32 71 32 67 36 64 Z" fill="#1B9DF0"/>
  </symbol>

  <!-- R4 squeegee + brand pyyhkäisy curve -->
  <symbol id="r4" viewBox="0 0 104 92">
    <g transform="rotate(34 54 44)">
      <rect x="47" y="2" width="14" height="9" rx="4.5" fill="#0B3A66"/>
      <rect x="50.5" y="9" width="7" height="29" rx="3.5" fill="#0B3A66"/>
      <rect x="32" y="37" width="44" height="8" rx="4" fill="#0B3A66"/>
      <rect x="35" y="45" width="38" height="5" rx="2.5" fill="#1B9DF0"/>
    </g>
    <path d="M8 72 C36 61 74 59 98 62 C104 62.6 100 68 92 68.5 C68 70 38 72 12 80 C4 82 2 74 8 72 Z" fill="#1B9DF0"/>
  </symbol>

  <!-- S5 app-icon (kept) -->
  <symbol id="s5" viewBox="0 0 100 100">
    <rect x="4" y="4" width="92" height="92" rx="26" fill="#1B9DF0"/>
    <g transform="rotate(30 50 50)">
      <rect x="44" y="20" width="13" height="8" rx="4" fill="#fff"/>
      <rect x="47" y="27" width="7" height="22" rx="3.5" fill="#fff"/>
      <rect x="30" y="48" width="42" height="9" rx="4.5" fill="#fff"/>
      <rect x="33" y="56" width="36" height="5" rx="2.5" fill="#bfe4fb"/>
    </g>
    <path d="M24 78 C42 70 64 69 82 72 C70 76 50 77.5 28 83 C21 84 19 79 24 78 Z" fill="#fff" opacity=".92"/>
  </symbol>

  <!-- S6 bubble + wipe (kept) -->
  <symbol id="s6" viewBox="0 0 100 86">
    <circle cx="50" cy="32" r="22" fill="none" stroke="#1B9DF0" stroke-width="6"/>
    <circle cx="42" cy="24" r="5.5" fill="#7fd0ff"/>
    <path d="M12 66 C36 58 66 57 88 59 C74 64 46 66 16 72 C8 73.5 6 68 12 66 Z" fill="#1B9DF0"/>
  </symbol>

</defs></svg>

<div class="row"><div class="tag">R1 · Klassinen+<small>pidempi varsi</small></div>
  <svg class="big"><use href="#r1"/></svg>
  <div><div class="chip cw"><svg><use href="#r1"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#r1"/></svg></div></div>

<div class="row"><div class="tag">R2 · Dynaaminen<small>jyrkkä kulma</small></div>
  <svg class="big"><use href="#r2"/></svg>
  <div><div class="chip cw"><svg><use href="#r2"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#r2"/></svg></div></div>

<div class="row"><div class="tag">R3 · Duotone + tippa<small>sininen terä</small></div>
  <svg class="big"><use href="#r3"/></svg>
  <div><div class="chip cw"><svg><use href="#r3"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#r3"/></svg></div></div>

<div class="row"><div class="tag">R4 · Lasta + pyyhkäisy<small>matchaa sanamerkkiä</small></div>
  <svg class="big"><use href="#r4"/></svg>
  <div><div class="chip cw"><svg><use href="#r4"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#r4"/></svg></div></div>

<div class="row"><div class="tag">S5 · App-ikoni<small>squircle, valmis</small></div>
  <svg class="big"><use href="#s5"/></svg>
  <div><div class="chip cw"><svg><use href="#s5"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#s5"/></svg></div></div>

<div class="row"><div class="tag">S6 · Kupla + veto<small>vaihtoehto</small></div>
  <svg class="big"><use href="#s6"/></svg>
  <div><div class="chip cw"><svg><use href="#s6"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#s6"/></svg></div></div>

</body></html>
