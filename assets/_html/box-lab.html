<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  body{background:#EAF2FA;padding:0;display:block;width:880px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:26px;padding:24px 44px;border-bottom:1px solid #d7e4f1}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 168px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.45}
  .tag small{display:block;font-weight:400;color:#7d95ad;margin-top:3px;font-size:12px}
  .big{width:94px;height:94px}
  .chip{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
  .chip svg{width:34px;height:34px}
  .cw{background:#fff;border:1px solid #dbe7f3}
  .cn{background:#0A1F3C}
  .lab{font-family:'Inter';font-size:10px;color:#94a8bb;text-align:center;margin-top:2px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

  <!-- B1 closed box + tape + sparkle -->
  <symbol id="b1" viewBox="0 0 96 92">
    <rect x="16" y="30" width="50" height="44" rx="5" fill="#0B3A66"/>

    <path d="M41 30 V44" stroke="#5AB7F5" stroke-width="3.4"/>

    <path d="M80 16 C80 23 83 26 90 26 C83 26 80 29 80 36 C80 29 77 26 70 26 C77 26 80 23 80 16 Z" fill="#2BB3F7"/>

  <!-- B3 box on wipe + sparkle -->

  <symbol id="b4" viewBox="0 0 96 92">

    <path d="M16 41 H66" stroke="#1B9DF0" stroke-width="2.6" opacity=".4"/>

  <!-- B5 outline box + sparkle -->
  <symbol id="b5" viewBox="0 0 96 92">
    <rect x="17" y="31" width="48" height="42" rx="5" fill="none" stroke="#0B3A66" stroke-width="4.5"/>

<div class="row"><div class="tag">B1 · Laatikko + sparkle<small>suljettu, teippisauma</small></div>
