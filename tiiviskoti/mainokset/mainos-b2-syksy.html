<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — mainos: BOFU syksy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_ad.css" rel="stylesheet">
<style>
  /* Esikatselu 25.8. paljasti että syötteessä kuva näkyy n. 390 pt leveänä,
     eli 1080 px skaalautuu 0,36-kertaiseksi. Merkit (25 px -> 9 pt) ja
     pikkupräntti (22 px -> 8 pt) olivat lukukelvottomia. Molemmat poistettu,
     ja jäljelle jäävä teksti nostettu luettavaan kokoon. */
/* Tämän sarjan kuvat ovat vaaleita (harmaa lautaseinä, valkoiset karmit),
     joten kalvo on vahvempi kuin _ad.css:n oletus ja kicker valkoinen —
     mintunvihreä katoaisi vaaleaan seinään. Sama ratkaisu kuin mainos-ovi. */
  .scrim.tb{background:linear-gradient(180deg,
    rgba(18,53,40,.50) 0%, rgba(18,53,40,.16) 20%,
    rgba(18,53,40,.44) 36%, rgba(18,53,40,.88) 52%,
    rgba(18,53,40,.96) 70%, rgba(18,53,40,.99) 100%)}
  /* Palvelun nimi EI saa nojata pelkkään tekstiin: valkoinen kicker hukkui
     vaaleaan lautaseinään, ja kolmesta mainoksesta ei käynyt lainkaan ilmi
     mitä myydään (Josua 25.8.). Kicker on nyt umpinainen pilleri, ja sama
     rivi "Ovien & ikkunoiden tiivistys" on kaikissa kuudessa. Vaiheen oma
     sanoma siirtyi merkkeihin ja leipätekstiin. */
  .kicker{align-self:flex-start;color:#fff;text-shadow:none;
    font-size:27px;letter-spacing:.10em;
    background:rgba(12,38,26,.86);border:1px solid rgba(255,255,255,.26);
    padding:13px 26px;border-radius:999px}
  .kicker::before{display:none}
  .badges{display:flex;flex-wrap:wrap;gap:16px;margin-top:32px}
  .badge{display:inline-flex;align-items:center;gap:12px;font-size:25px;font-weight:700;color:#fff;
    background:rgba(22,58,40,.42);border:1px solid rgba(255,255,255,.24);
    padding:14px 22px;border-radius:999px}
  .badge svg{width:22px;height:22px;flex:none}
  .display{font-size:98px}
</style>
</head>
<body class="on-dark">
  <div class="photo"><img src="kuvat/ad-kela.jpg" alt=""></div>
  <div class="scrim tb"></div><div class="grain"></div>
  <div class="canvas pad"><div class="layer">
      <div class="brandrow">
        <div class="brand">
          <svg class="mark" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="22" fill="#217A4E"/>
            <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#F6F7F3" stroke-width="5"/>
            <rect x="35" y="20" width="4" height="60" fill="#F6F7F3"/>
          </svg>
          <div class="wordmark"><span class="d">Tiivis</span><span class="b">Koti</span></div>
        </div>
        <span class="pill glass-pill">Koko Uusimaa</span>
      </div>
      <div class="grow"></div>
      <div class="kicker">Ovien &amp; ikkunoiden tiivistys</div>
      <h1 class="display mt-s">Ennen<br>ensimmäisiä<br>pakkasia.</h1>
      <p class="lead mt-s">Tiivisteet kannattaa vaihtaa kun ulkona on vielä lämmintä:
        kumi asettuu paikalleen, eikä ensimmäinen pakkasyö yllätä.</p>
      <a class="cta mt-l">Varaa aika verkossa <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg></span></a>
      <div class="divider mt-l"></div>
      <div class="foot" style="margin-top:26px">
        <div class="url">tiiviskoti.fi</div>
      </div>
  </div></div>
</body></html>
