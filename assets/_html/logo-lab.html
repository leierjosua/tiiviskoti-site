<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  body{background:#EAF2FA;padding:0;display:block;width:1220px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:30px;padding:36px 50px;border-bottom:1px solid #d7e4f1}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 168px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.45;text-transform:uppercase;letter-spacing:.05em}
  .tag small{display:block;font-weight:400;text-transform:none;letter-spacing:0;color:#7d95ad;margin-top:3px;font-size:12px}
  .lg{font-family:'Gabarito';font-weight:700;letter-spacing:-.04em;line-height:1;white-space:nowrap;display:inline-block;position:relative;font-size:72px}
  .ink{color:#0B3A66}.bl{color:#1B9DF0}
  .b{position:relative;display:inline-block}
  .wipe{position:absolute;left:0;bottom:-.17em;width:100%;height:.34em;overflow:visible}
  .bub{display:inline-block;width:.31em;height:.31em;border-radius:50%;background:#1B9DF0;position:relative;vertical-align:baseline;margin:0 .015em}
  .bub::after{content:"";position:absolute;width:36%;height:36%;border-radius:50%;background:rgba(255,255,255,.9);left:18%;top:15%}
</style></head>
<body>

<!-- A · SUOSITUS: vahva pyyhkäisy + kuplapiste -->
<div class="row"><div class="tag">A · Suositus<small>vahva veto + kuplapiste</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" style="bottom:-.18em;height:.38em" viewBox="0 0 210 22" preserveAspectRatio="none"><path d="M5 14 C65 7 145 6 188 5 C198 4.4 204 2.6 207 0 C205 7 198 9.5 190 10.5 C145 14 65 15 9 19 C1 19.6 -2 14 5 14 Z" fill="#1B9DF0"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
</div>

<!-- B · Pyyhkäisy v2 + pisara -->
<div class="row"><div class="tag">B · Pyyhkäisy v2<small>veto .fi:n alle + pisara</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b"><span class="bl">siivous</span><span class="ink">.fi</span><svg class="wipe" style="bottom:-.20em;height:.42em" viewBox="0 0 300 22" preserveAspectRatio="none"><path d="M4 13 C90 6 200 5 280 4 C289 3.5 294 2 296 0 C294 7 287 9 278 10 C200 13 90 14 9 18 C1 18.6 -2 13 4 13 Z" fill="#1B9DF0"/><circle cx="299" cy="2.5" r="3.6" fill="#1B9DF0"/></svg></span></span>
</div>

<!-- C · Kuplapiste -->
<div class="row"><div class="tag">C · Kuplapiste<small>.fi piste = saippuakupla</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b bl">siivous<svg class="wipe" viewBox="0 0 206 20" preserveAspectRatio="none"><path d="M6 12 C60 8 140 7 186 6 C196 5.6 202 4 205 1 C202 6 196 8 188 9 C140 12 60 13 9 17 C2 17.4 0 12 6 12 Z" fill="#1B9DF0"/></svg></span><span class="bub"></span><span class="ink">fi</span></span>
</div>

<!-- D · Squeegee-symboli (korjattu, vino + pyyhkäisyjälki) -->
<div class="row"><div class="tag">D · Squeegee-symboli<small>oma merkki → favicon</small></div>
  <svg width="96" height="80" viewBox="0 0 96 80" fill="none" style="flex:0 0 auto">
    <g transform="rotate(28 48 30)">
      <rect x="43" y="2" width="10" height="22" rx="5" fill="#0B3A66"/>
      <rect x="26" y="22" width="44" height="11" rx="5.5" fill="#0B3A66"/>
      <rect x="29" y="32" width="38" height="6" rx="3" fill="#1B9DF0"/>
    </g>
    <path d="M8 66 C32 57 62 55 86 57 C72 62 42 64 12 72 C4 73.5 2 68 8 66 Z" fill="#1B9DF0"/>
  </svg>
  <span class="lg"><span class="ink">Loppu</span><span class="bl">siivous</span><span class="ink">.fi</span></span>
</div>

<!-- E · Monokromi premium -->
<div class="row"><div class="tag">E · Monokromi<small>aikuinen / korporaatio</small></div>
  <span class="lg"><span class="ink">Loppu</span><span class="b ink">siivous<svg class="wipe" style="bottom:-.18em;height:.38em" viewBox="0 0 210 22" preserveAspectRatio="none"><path d="M5 14 C65 7 145 6 188 5 C198 4.4 204 2.6 207 0 C205 7 198 9.5 190 10.5 C145 14 65 15 9 19 C1 19.6 -2 14 5 14 Z" fill="#1B9DF0"/></svg></span><span class="bl">.fi</span></span>
</div>

</body></html>
