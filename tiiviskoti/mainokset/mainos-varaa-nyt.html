<!doctype html>
<html lang="fi"><head>
<meta charset="utf-8">
<title>TiivisKoti — niukka mainos: mainos-varaa-nyt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="_niukka.css" rel="stylesheet">
</head>
<body>
  <!-- Sama ankkurikulma kuin TK31:ssä, joka on kerännyt eniten liidejä
       (2 kpl / 30 € liidi). Ero: nappi on "Varaa nyt" eikä "Pyydä tarjous",
       koska tämä versio on tarkoitettu omaan Facebook-julkaisuun, jossa
       kehotus vie suoraan verkkovaraukseen eikä liidilomakkeelle.

       Omaa yksikköhintaa ei mainita (Josuan linjaus 4.9.), vain "alk. 149 €".
       Vertailuluku 2 200 € on uuden oven hinta, ei meidän. -->
  <div class="photo"><img src="kuvat/ad-ovi.jpg" alt=""></div>
  <div class="wash"></div>

  <div class="mark">
    <svg viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#F6F7F3"/>
      <rect x="31" y="20" width="38" height="60" rx="3" fill="none" stroke="#217A4E" stroke-width="5"/>
      <rect x="35" y="20" width="4" height="60" fill="#217A4E"/>
    </svg>
    <span>TiivisKoti</span>
  </div>

  <div class="block">
    <h1>Uusi ovi 2 200 €.<br><span class="hl">Tiivistys alk. 149 €.</span></h1>
    <p class="sub">Jos ovilehti ja karmi ovat suorassa, tiivisteiden vaihto riittää lähes aina</p>
    <span class="btn">Varaa nyt
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12M12 6l6 6-6 6"/></svg>
    </span>
  </div>
</body></html>
