<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="brand.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{background:#EAF2FA;display:block;width:880px;font-family:'Gabarito'}
  .row{display:flex;align-items:center;gap:30px;padding:30px 46px;border-bottom:1px solid #d7e4f1}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 175px;font-family:'Inter';font-size:13px;font-weight:700;color:#5b7a99;line-height:1.45}
  .tag small{display:block;font-weight:400;color:#7d95ad;margin-top:3px;font-size:12px}
  .big{width:108px;height:108px;flex:0 0 auto}
  .chip{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto}
  .chip svg{width:38px;height:38px}
  .cw{background:#fff;border:1px solid #d4e3f1}
  .cn{background:#0A1F3C}
  .lab{font-family:'Inter';font-size:10px;color:#94a8bb;text-align:center;margin-top:2px}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

  <!-- A: CLOSED taped box (classic 📦) -->
  <symbol id="a" viewBox="0 0 100 100">
    <g fill="none" stroke="#0B3A66" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M22 42 L50 28 L78 42 L50 56 Z"/>
      <path d="M22 42 L22 72 L50 86 L78 72 L78 42"/>
      <path d="M50 56 L50 86"/>
    </g>
    <g fill="none" stroke="#1B9DF0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M50 28 L50 56"/>
      <path d="M22 56 L50 70 L78 56"/>
    </g>
    <path d="M86 16 C86 23 89 26 96 26 C89 26 86 29 86 36 C86 29 83 26 76 26 C83 26 86 23 86 16 Z" fill="#2BB3F7"/>
  </symbol>
  <symbol id="aw" viewBox="0 0 100 100">
    <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M22 42 L50 28 L78 42 L50 56 Z"/>
      <path d="M22 42 L22 72 L50 86 L78 72 L78 42"/>
      <path d="M50 56 L50 86"/>
    </g>
    <g fill="none" stroke="#5AB7F5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M50 28 L50 56"/>
      <path d="M22 56 L50 70 L78 56"/>
    </g>
    <path d="M86 16 C86 23 89 26 96 26 C89 26 86 29 86 36 C86 29 83 26 76 26 C83 26 86 23 86 16 Z" fill="#7CC6F2"/>
  </symbol>

  <!-- B: OPEN box, 4 flaps clearly folded out -->
  <symbol id="b" viewBox="0 0 100 100">
    <g fill="none" stroke="#0B3A66" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M30 54 L30 74 L50 86 L70 74 L70 54"/>
      <path d="M50 64 L50 86"/>
      <path d="M30 54 L50 64 L70 54 L50 44 Z"/>
      <path d="M30 54 L16 46 L34 36 L50 44"/>
      <path d="M70 54 L84 46 L66 36 L50 44"/>
    </g>
    <path d="M50 10 C50 18 53 21 61 21 C53 21 50 24 50 32 C50 24 47 21 39 21 C47 21 50 18 50 10 Z" fill="#1B9DF0"/>
  </symbol>
  <symbol id="bw" viewBox="0 0 100 100">
    <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M30 54 L30 74 L50 86 L70 74 L70 54"/>
      <path d="M50 64 L50 86"/>
      <path d="M30 54 L50 64 L70 54 L50 44 Z"/>
      <path d="M30 54 L16 46 L34 36 L50 44"/>
      <path d="M70 54 L84 46 L66 36 L50 44"/>
    </g>
    <path d="M50 10 C50 18 53 21 61 21 C53 21 50 24 50 32 C50 24 47 21 39 21 C47 21 50 18 50 10 Z" fill="#5AB7F5"/>
  </symbol>

  <!-- C: front box, tape cross + lid line (very box) -->
  <symbol id="c" viewBox="0 0 100 100">
    <g fill="none" stroke="#0B3A66" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="24" y="34" width="52" height="48" rx="4"/>
      <path d="M24 48 L76 48"/>
    </g>
    <g fill="none" stroke="#1B9DF0" stroke-width="5" stroke-linecap="round">
      <path d="M50 34 L50 82"/>
    </g>
    <path d="M84 22 C84 29 87 32 94 32 C87 32 84 35 84 42 C84 35 81 32 74 32 C81 32 84 29 84 22 Z" fill="#2BB3F7"/>
  </symbol>
  <symbol id="cw" viewBox="0 0 100 100">
    <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="24" y="34" width="52" height="48" rx="4"/>
      <path d="M24 48 L76 48"/>
    </g>
    <g fill="none" stroke="#5AB7F5" stroke-width="5" stroke-linecap="round">
      <path d="M50 34 L50 82"/>
    </g>
    <path d="M84 22 C84 29 87 32 94 32 C87 32 84 35 84 42 C84 35 81 32 74 32 C81 32 84 29 84 22 Z" fill="#7CC6F2"/>
  </symbol>

</defs></svg>

<div class="row"><div class="tag">A · Suljettu + teippi<small>klassinen 📦, 3/4</small></div>
  <svg class="big"><use href="#a"/></svg>
  <div><div class="chip cw"><svg><use href="#a"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#aw"/></svg></div></div>

<div class="row"><div class="tag">B · Avoin, läpät ulos<small>4 selvää läppää</small></div>
  <svg class="big"><use href="#b"/></svg>
  <div><div class="chip cw"><svg><use href="#b"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#bw"/></svg></div></div>

<div class="row"><div class="tag">C · Etukulma + teippiristi<small>yksinkertaisin</small></div>
  <svg class="big"><use href="#c"/></svg>
  <div><div class="chip cw"><svg><use href="#c"/></svg></div><div class="lab">favicon</div></div>
  <div class="chip cn"><svg><use href="#cw"/></svg></div></div>

</body></html>
